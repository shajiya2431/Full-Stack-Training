<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <script type="module" src="./js/main.js"></script>
</head>

<body>

  <div class="container-fluid p-0">

    <div class="d-flex">

      <aside class="sidebar"></aside>

      <main class="content">

        <div class="header-box"></div>

        <div class="row mt-4 g-4">

          <div class="col-lg-6">

            <div class="parent-card p-3 mb-3">

              <div class="row g-3">

                <div class="col-4">
                  <div class="card-box"></div>
                </div>

                <div class="col-4">
                  <div class="card-box"></div>
                </div>

                <div class="col-4">
                  <div class="card-box"></div>
                </div>

              </div>

            </div>

            <div class="parent-card p-3">

              <div class="row g-3">

                <div class="col-7">
                  <div class="card-box"></div>
                </div>

                <div class="col-5">
                  <div class="card-box"></div>
                </div>

              </div>

            </div>

          </div>

          <div class="col-lg-6">

            <div class="right-card">

              <div class="right-top"></div>

              <div class="right-bottom"></div>

            </div>

          </div>

        </div>
        
        <div class="bottom-card mt-4">

          <div class="row g-3 align-items-center">

            <div class="col-3">
              <div class="bottom-box"></div>
            </div>

            <div class="col-2">
              <div class="bottom-box small-box1"></div>
            </div>

            <div class="col-2">
              <div class="bottom-box"></div>
            </div>

            <div class="col-2">
              <div class="bottom-box white-box"></div>
            </div>

            <div class="col-1">
              <div class="bottom-box tiny-box"></div>
            </div>

          </div>

        </div>

      </main>

    </div>

  </div>

</body>

</html>
