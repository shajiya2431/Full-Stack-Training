<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>flex Layout</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#f5f5f5;
      font-family:Arial, Helvetica, sans-serif;
      padding:20px;
    }

    .container{
      display:grid;
      grid-template-columns:220px 1fr;
      gap:20px;
      height:100vh;

      max-width:1000px;
      width:100%;
    }

    /* Sidebar */
    .sidebar{
      background:#120814;
      border-radius:10px;
    }

    /* Main Content */
    .main{
      display:grid;
      grid-template-rows:auto auto auto auto;
      gap:25px;
    }

    /* Top Banner */
    .banner{
      height:180px;
      background:#e7e7e7;
      border-radius:10px;
    }

    /* Section 2 */
    .section-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
      padding:15px;
      border:2px solid #eee;
      border-radius:10px;
      background:#fff;
    }

    .card{
      height:120px;
      background:#e7e7e7;
      border-radius:8px;
    }

    .big-box{
      background:#fff;
      border:2px solid #eee;
      border-radius:10px;
      overflow:hidden;
    }

    .big-box .top{
      height:160px;
      background:#e7e7e7;
    }

    .big-box .bottom{
      height:160px;
      background:#fff;
    }

    /* Section 3 */
    .section-3{
      width:420px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      padding:15px;
      border:2px solid #eee;
      border-radius:10px;
      background:#fff;
    }

    .small-box{
      height:100px;
      background:#e7e7e7;
      border-radius:8px;
    }

    /* Bottom Section */
    .bottom-section{
      background:#e7e7e7;
      border-radius:10px;
      padding:25px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:20px;
      align-items:end;
    }

    .item{
      background:#dcdcdc;
      border-radius:8px;
    }

    .h1{ height:100px; }
    .h2{ height:140px; }
    .h3{ height:150px; }
    .h4{ height:180px; background:#fff; }
    .h5{ height:80px; background:#fff; }

  </style>
</head>

<body>

  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar"></div>

    <!-- Main -->
    <div class="main">

      <!-- Banner -->
      <div class="banner"></div>

      <!-- Section 2 -->
      <div class="section-2">

        <div class="cards">
          <div class="card"></div>
          <div class="card"></div>
          <div class="card"></div>
        </div>

        <div class="big-box">
          <div class="top"></div>
          <div class="bottom"></div>
        </div>

      </div>

      <!-- Section 3 -->
      <div class="section-3">
        <div class="small-box"></div>
        <div class="small-box"></div>
      </div>

      <!-- Bottom -->
      <div class="bottom-section">
        <div class="item h1"></div>
        <div class="item h2"></div>
        <div class="item h3"></div>
        <div class="item h4"></div>
        <div class="item h5"></div>
      </div>

    </div>

  </div>

</body>
</html>
