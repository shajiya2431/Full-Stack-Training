<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Media Elements & Iframes</title>

</head>
<body>

  <h1>Html Media Elements & Irframes</h1>
  <h2>Image Example</h2>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EwQiVBAX_3xxgxl0tdBh3DOF184ss0Qgcg&s">

  <h2>Auido Example</h2>
  <audio controls muted autoplay>
    <source src="gfg_offline_classes_en.mp3" muted autoplay controls>
    <source src="sample-3.ogg" muted autoplay controls>
 </audio>
  

  <h2>Sample Video</h2>
  <video width="300" height="200" muted autoplay loop src="345137_medium.mp4"></video>
    
  
  <h2>YouTube Video (Start from 1:20)</h2>
  <iframe width="560" height="315" 
  src="https://www.youtube.com/embed/VeaAMwpiLbI?start=80"
  title="YouTube video"
  frameborder="0"
  allowfullscreen>
  </iframe>

  <h2>Map of Siwan, Bihar</h2>

  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d28633.56850096529!2d84.35982120000003!3d26.222818250000017!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3992fc0166e38983%3A0x623c6c1cb7d5211f!2sSiwan%2C%20Bihar!5e0!3m2!1sen!2sin!4v1776404151256!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
