<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data Table</title>
</head>

<body>

    <h1>User Data Table</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>DoB</th>
                <th>Age</th>
                <th>Salary</th>
                <th>Skills</th>
            </tr>
        </thead>

        <tbody id="userTableBody">
        </tbody>
    </table>

    <script>

        const users = [
            {
                id: 101,
                name: "  alex JOHNSON ",
                dob: "1992-06-15",
                salary: "55000",
                skills: ["html", "css", "javascript"]
            },

            {
                id: 102,
                name: "  maria  smith  ",
                dob: "1988-11-03",
                salary: "72000",
                skills: ["react", "node", "css"]
            },

            {
                id: 103,
                name: "john doe",
                dob: "1996-02-25",
                salary: "48000",
                skills: ["vue", "javascript", "html"]
            }
        ];


        // Name ko clean karke Title Case karne ke liye
        function formatName(name) {

            return name
                .trim()
                .toLowerCase()
                .split(/\s+/)
                .map(word =>
                    word.charAt(0).toUpperCase() + word.slice(1)
                )
                .join(" ");

        }


        // Date ko readable format me convert karne ke liye
        function formatDate(dob) {

            const date = new Date(dob);

            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });

        }


        // Age calculate karne ke liye
        function calculateAge(dob) {

            const birthDate = new Date(dob);
            const today = new Date();

            let age =
                today.getFullYear() - birthDate.getFullYear();

            const monthDifference =
                today.getMonth() - birthDate.getMonth();

            if (
                monthDifference < 0 ||
                (
                    monthDifference === 0 &&
                    today.getDate() < birthDate.getDate()
                )
            ) {
                age--;
            }

            return age;

        }


        // Table body ko select kar rahe hain
        const tableBody = document.getElementById("userTableBody");


        // Users array par iterate kar rahe hain
        users.forEach(user => {

            // New table row
            const row = document.createElement("tr");


            // Name
            const nameCell = document.createElement("td");
            nameCell.textContent = formatName(user.name);


            // DoB
            const dobCell = document.createElement("td");
            dobCell.textContent = formatDate(user.dob);


            // Age
            const ageCell = document.createElement("td");
            ageCell.textContent = calculateAge(user.dob);


            // Salary
            const salaryCell = document.createElement("td");
            salaryCell.textContent = Number(user.salary);


            // Skills
            const skillsCell = document.createElement("td");

            skillsCell.textContent = user.skills
                .map(skill =>
                    skill.charAt(0).toUpperCase() + skill.slice(1)
                )
                .join(", ");


            // Cells ko row me add karna
            row.appendChild(nameCell);
            row.appendChild(dobCell);
            row.appendChild(ageCell);
            row.appendChild(salaryCell);
            row.appendChild(skillsCell);


            // Row ko table body me add karna
            tableBody.appendChild(row);

        });

    </script>

</body>

</html>
