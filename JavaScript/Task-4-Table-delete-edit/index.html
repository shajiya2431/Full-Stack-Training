<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Data Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 90%;
            border-collapse: collapse;
            margin: 30px auto;
        }

        th,
        td {
            border: 1px solid black;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #9fe9f7;
        }

        button {
            padding: 7px 12px;
            margin-right: 5px;
            cursor: pointer;
        }

        dialog {
            width: 350px;
            border: none;
            border-radius: 10px;
            padding: 25px;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 8px;
        }

        .form-buttons {
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <h1>User Data Table</h1>


    <!-- =========================
         TABLE
    ========================== -->

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>DoB</th>

                <th>Age</th>

                <th>Salary</th>

                <th>Skills</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="userTableBody">

        </tbody>

    </table>


    <!-- =========================
         EDIT DIALOG
    ========================== -->

    <dialog id="editDialog">

        <h2>Edit User</h2>


        <form id="editForm">

            <label>
                Name
            </label>

            <input type="text" id="editName" required>


            <label>
                DoB
            </label>

            <input type="date" id="editDob" required>


            <label>
                Salary
            </label>

            <input type="number" id="editSalary" required>


            <label>
                Skills
            </label>

            <input type="text" id="editSkills" placeholder="HTML, CSS, JavaScript" required>


            <div class="form-buttons">

                <button type="submit">
                    Update
                </button>

                <button type="button" id="cancelButton">
                    Cancel
                </button>

            </div>

        </form>

    </dialog>


    <script>

        // Users Data
    
        const users = [

            {
                id: 101,
                name: "  alex JOHNSON ",
                dob: "1992-06-15",
                salary: "55000",
                skills: ["html", "css", "javascript"]
            },

            {
                id: 102,
                name: "  maria smith  ",
                dob: "1988-11-03",
                salary: "72000",
                skills: ["react", "node", "css"]
            },

            {
                id: 103,
                name: "john doe",
                dob: "1996-02-25",
                salary: "48000",
                skills: ["vue", "javascript", "html"]
            }

        ];

        // Format Name


        function formatName(name) {

            return name
                .trim()
                .toLowerCase()
                .split(/\s+/)
                .map(function (word) {

                    return word.charAt(0).toUpperCase()
                        + word.slice(1);

                })
                .join(" ");

        }

        // Format Date

        function formatDate(dob) {

            const date = new Date(dob);

            return date.toLocaleDateString("en-GB", {

                day: "2-digit",

                month: "short",

                year: "numeric"

            });

        }

        // Calculate Age


        function calculateAge(dob) {

            const birthDate = new Date(dob);

            const today = new Date();


            let age =
                today.getFullYear()
                - birthDate.getFullYear();


            const monthDifference =
                today.getMonth()
                - birthDate.getMonth();


            if (
                monthDifference < 0
                ||
                (
                    monthDifference === 0
                    &&
                    today.getDate() < birthDate.getDate()
                )
            ) {

                age--;

            }

            return age;

        }

        // Select Elements


        const tableBody =
            document.getElementById("userTableBody");


        const editDialog =
            document.getElementById("editDialog");


        const editForm =
            document.getElementById("editForm");


        const editName =
            document.getElementById("editName");


        const editDob =
            document.getElementById("editDob");


        const editSalary =
            document.getElementById("editSalary");


        const editSkills =
            document.getElementById("editSkills");


        const cancelButton =
            document.getElementById("cancelButton");


        // Current editing user's index

        let editingIndex = null;


        // Render Table

        function renderTable() {

            // Pehle purani rows remove karo

            tableBody.innerHTML = "";


            // Users array par loop

            users.forEach(function (user, index) {

                // Create Row


                const row =
                    document.createElement("tr");

                // Name

                const nameCell =
                    document.createElement("td");

                nameCell.textContent =
                    formatName(user.name);


                // DoB

                const dobCell =
                    document.createElement("td");

                dobCell.textContent =
                    formatDate(user.dob);

                // Age

                const ageCell =
                    document.createElement("td");

                ageCell.textContent =
                    calculateAge(user.dob);
                        
                // Salary
                // =========================

                const salaryCell =
                    document.createElement("td");

                salaryCell.textContent =
                    Number(user.salary);


                // =========================
                // Skills
                // =========================

                const skillsCell =
                    document.createElement("td");


                skillsCell.textContent =
                    user.skills
                        .map(function (skill) {

                            return skill.charAt(0).toUpperCase()
                                + skill.slice(1);

                        })
                        .join(", ");


                // =========================
                // Action Cell
                // =========================

                const actionCell =
                    document.createElement("td");


                // =========================
                // Delete Button
                // =========================

                const deleteButton =
                    document.createElement("button");


                deleteButton.textContent = "Delete";


                deleteButton.addEventListener(
                    "click",
                    function () {

                        users.splice(index, 1);

                        renderTable();

                    }
                );


                // =========================
                // Edit Button
                // =========================

                const editButton =
                    document.createElement("button");


                editButton.textContent = "Edit";


                editButton.addEventListener(
                    "click",
                    function () {

                        editingIndex = index;


                        // Existing data form mein fill karo

                        editName.value =
                            user.name.trim();


                        editDob.value =
                            user.dob;


                        editSalary.value =
                            user.salary;


                        editSkills.value =
                            user.skills.join(", ");


                        // Dialog open karo

                        editDialog.showModal();

                    }
                );


                // =========================
                // Buttons Add to Action Cell
                // =========================

                actionCell.appendChild(deleteButton);

                actionCell.appendChild(editButton);


                // =========================
                // Cells Add to Row
                // =========================

                row.appendChild(nameCell);

                row.appendChild(dobCell);

                row.appendChild(ageCell);

                row.appendChild(salaryCell);

                row.appendChild(skillsCell);

                row.appendChild(actionCell);


                // =========================
                // Row Add to Table
                // =========================

                tableBody.appendChild(row);

            });

        }


        // =========================
        // Edit Form Submit
        // =========================

        editForm.addEventListener(
            "submit",
            function (event) {

                // Form ka default reload stop

                event.preventDefault();


                // User ka data update

                users[editingIndex].name =
                    editName.value;


                users[editingIndex].dob =
                    editDob.value;


                users[editingIndex].salary =
                    editSalary.value;


                users[editingIndex].skills =
                    editSkills.value
                        .split(",")
                        .map(function (skill) {

                            return skill.trim();

                        });


                // Table dobara render

                renderTable();


                // Dialog close

                editDialog.close();


                // Editing index reset

                editingIndex = null;

            }
        );


        // =========================
        // Cancel Button
        // =========================

        cancelButton.addEventListener(
            "click",
            function () {

                editDialog.close();

            }
        );


        // =========================
        // Initial Table
        // =========================

        renderTable();


    </script>

</body>

</html>
