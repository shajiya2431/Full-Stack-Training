
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .search-box {
            width: 90%;
            margin: 25px auto;
            display: flex;
            justify-content: center;
        }

        #searchInput {
            width: 400px;
            padding: 12px 18px;
            font-size: 15px;
            border: 1px solid #aaa;
            border-radius: 25px;
            outline: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px 6px;
            text-align: left;
            font-size: 15px;
        }

        th {
            background-color: rgb(194, 247, 231);
        }
    </style>

</head>


<body>

    <h1>Users Table</h1>


    <!-- Search Input -->

    <div class="search-box">

        <input type="text" id="searchInput" placeholder="Search name, email, address, phone...">

    </div>


    <!-- Table -->

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>Email</th>

                <th>Address</th>

                <th>Phone</th>

                <th>Company Name</th>

            </tr>

        </thead>


        <tbody id="userTable"></tbody>

    </table>


    <script>

        // Select Elements


        let userTable =
            document.getElementById("userTable");

        let searchInput =
            document.getElementById("searchInput");


        // Store Users

        let allUsers = [];


        // Fetch API

        fetch("https://jsonplaceholder.typicode.com/users")

            .then(function (response) {

                return response.json();

            })

            .then(function (users) {

                allUsers = users;

                showUsers(users);

            })

            .catch(function (error) {

                console.log("Error:", error);

            });

        // Show Users


        function showUsers(users) {

            userTable.innerHTML = "";


            users.forEach(function (user) {

                let tr =
                    document.createElement("tr");


                tr.innerHTML = `

                    <td>${user.name}</td>

                    <td>${user.email}</td>

                    <td>
                        ${user.address.street},
                        ${user.address.suite},
                        ${user.address.city},
                        Zip Code: ${user.address.zipcode}
                    </td>

                    <td>${user.phone}</td>

                    <td>${user.company.name}</td>

                `;


                userTable.appendChild(tr);

            });

        }

        // Search / Filter

        searchInput.addEventListener(
            "input",
            function () {

                let searchValue =
                    searchInput.value
                        .toLowerCase()
                        .trim();


                let filteredUsers =
                    allUsers.filter(function (user) {

                        return (

                            // Name
                            user.name
                                .toLowerCase()
                                .includes(searchValue)


                            ||

                            // Email
                            user.email
                                .toLowerCase()
                                .includes(searchValue)


                            ||

                            // Street
                            user.address.street
                                .toLowerCase()
                                .includes(searchValue)


                            ||

                            // Suite
                            user.address.suite
                                .toLowerCase()
                                .includes(searchValue)


                            ||

                            // City
                            user.address.city
                                .toLowerCase()
                                .includes(searchValue)


                            ||

                            // Zip Code
                            user.address.zipcode
                                .toLowerCase()
                                .includes(searchValue)


                            ||

                            // Phone
                            user.phone
                                .toLowerCase()
                                .includes(searchValue)


                            ||

                            // Company Name
                            user.company.name
                                .toLowerCase()
                                .includes(searchValue)

                        );

                    });



                showUsers(filteredUsers);

            }

        );

    </script>


</body>

</html>
