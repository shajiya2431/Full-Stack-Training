<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users Table</title>

    <style>

         body {
            font-family: Arial, sans-serif;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px 6px;
            text-align: left;
            font-size: 15px;
        }

        th {
            background-color: rgb(194, 247, 231);
        }
        h1{
            text-align: center;
        }
    </style>

</head>

<body>

    <h1>Users Table</h1>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Company Name</th>
            </tr>
        </thead>

        <tbody id="userTable"></tbody>

    </table>


    <script>

        let userTable = document.getElementById("userTable");

        fetch("https://jsonplaceholder.typicode.com/users")

            .then(response => response.json())

            .then(users => {

                users.forEach(user => {

                    let tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${user.name}</td>

                        <td>${user.email}</td>

                        <td>
                            ${user.address.street},
                            ${user.address.suite},
                            ${user.address.city},
                            Zip Code: ${user.address.zipcode}
                        </td>

                        <td>${user.phone}</td>

                        <td>${user.company.name}</td>
                    `;

                    userTable.appendChild(tr);

                });

            })

            .catch(error => {
                console.log("Error:", error);
            });

    </script>

</body>

</html>
